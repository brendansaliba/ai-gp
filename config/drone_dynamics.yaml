simulation:
  dt: 0.01 # simulation timestep [s]
  steps: 2000 # number of simulation steps [-]
  gravity: 9.81 # gravitational acceleration [m/s^2]

dynamics:
  mass: 2 # vehicle mass [kg]
  inertia_diag: [0.02, 0.02, 0.05] # body inertia diagonal [Ixx, Iyy, Izz] [kg*m^2]
  arm_length: 0.11 # distance from center of mass to each motor [m]
  yaw_drag_coeff: 0.004 # yaw torque coefficient per motor thrust [N*m/N]
  enable_attitude_drag: true # enable attitude/airflow dependent drag model [bool]
  drag_coeff_min: 0.15 # minimum drag coefficient when body plane is aligned with airflow [-]
  drag_coeff_max: 1.10 # maximum drag coefficient when airflow is normal to body plane [-]
  drag_reference_area: 0.03 # aerodynamic reference area used in drag force model [m^2]
  air_density: 1.225 # air density for drag force computation [kg/m^3]
  wind_velocity_world: [0.0, 0.0, 0.0] # ambient wind velocity in world frame [vx, vy, vz] [m/s]
  motor_spin_dir: [1.0, -1.0, 1.0, -1.0] # motor spin directions [CCW=+1, CW=-1]

initial_state:
  position: [0.0, 0.0, 40.0] # initial world position [x, y, z] [m]
  velocity: [0.0, 0.0, 0.0] # initial world velocity [vx, vy, vz] [m/s]
  euler_deg: [0.0, 0.0, 0.0] # initial attitude [roll, pitch, yaw] [deg]
  angular_velocity: [0.0, 0.0, 0.0] # initial body angular velocity [p, q, r] [rad/s]

thrust:
  mode: flight_controller # thrust mode: "manual", "hover", or "flight_controller" [-]
  manual_motor_thrust_newtons: [5.0, 5.0, 5.0, 5.0] # per-motor thrust [m1, m2, m3, m4] [N]
  waypoints_xyz:
    - [40.0, 0.0, 40.0]
    - [38.0, 4.6, 40.0]
    - [32.4, 8.8, 40.0]
    - [23.5, 12.1, 40.0]
    - [12.4, 14.3, 40.0]
    - [0.0, 15.0, 40.0]
    - [-12.4, 14.3, 40.0]
    - [-23.5, 12.1, 40.0]
    - [-32.4, 8.8, 40.0]
    - [-38.0, 4.6, 40.0]
    - [-40.0, 0.0, 40.0]
    - [-38.0, -4.6, 40.0]
    - [-32.4, -8.8, 40.0]
    - [-23.5, -12.1, 40.0]
    - [-12.4, -14.3, 40.0]
    - [0.0, -15.0, 40.0]
    - [12.4, -14.3, 40.0]
    - [23.5, -12.1, 40.0]
    - [32.4, -8.8, 40.0]
    - [38.0, -4.6, 40.0]
  controller:
    waypoint_tolerance_m: 1.5
    max_speed_mps: 2.0
    max_accel_mps2: 10.0
    max_tilt_deg: 50.0
    max_motor_thrust_n: 40.0
    max_yaw_rate_rad_s: 0.8
    kp_pos: 0.7
    ki_pos: 0.03
    kd_vel: 1.2
    kp_att_rp: 4.0
    ki_att_rp: 0.05
    kd_rate_xy: 1.0
    kp_yaw: 1.6
    ki_yaw: 0.05
    kd_yaw_rate: 0.45
    pos_integral_limit: 6.0
    att_integral_limit: 0.4
    yaw_integral_limit: 1.2
    max_torque_xy_nm: 0.8
    max_torque_z_nm: 0.4

perturbations:
  enable: true # enable small aero/atmospheric disturbances [bool]
  perturbation_seed: 42 # random seed for reproducible perturbations [-]
  motor_thrust_noise_std: 0.005 # Gaussian std-dev added to each motor thrust [N]
  motor_thrust_gust_amp: 0.01 # low-frequency motor thrust gust amplitude [N]
  attitude_torque_noise_std: 0.00002 # Gaussian std-dev added to body torque [N*m]
  attitude_torque_gust_amp: 0.00015 # low-frequency body torque gust amplitude [N*m]
